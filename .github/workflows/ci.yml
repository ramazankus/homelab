name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  CADDY_IMAGE: caddy:2.10.2-alpine
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  sanitization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/check-sanitized.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        run: |
          shellcheck --version | head -2
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -t shellcheck

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate compose files against .env.example
        run: |
          status=0
          shopt -s nullglob
          for f in services/*/docker-compose.yml; do
            dir="$(dirname "$f")"
            echo "== $f"
            if [ ! -f "$dir/.env.example" ]; then
              echo "::error file=$f::missing $dir/.env.example"; status=1; continue
            fi
            out="$(docker compose -f "$f" --env-file "$dir/.env.example" config -q 2>&1)" || { echo "$out"; status=1; continue; }
            # Compose only warns on unset variables: turn it into a failure
            if grep -q 'variable is not set' <<<"$out"; then
              echo "::error file=$f::variables used in $f but missing from .env.example"
              echo "$out"; status=1
            fi
          done
          exit "$status"

  caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: caddy fmt
        run: |
          shopt -s nullglob
          for f in services/*/Caddyfile; do
            echo "== $f"
            docker run --rm -v "$PWD/$f:/Caddyfile:ro" "$CADDY_IMAGE" caddy fmt --diff /Caddyfile
          done

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
